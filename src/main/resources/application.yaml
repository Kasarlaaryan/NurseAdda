spring:
  application:
    name: nurseadda

  datasource:
    url: jdbc:mysql://localhost:3306/nurseadda
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080

jwt:
  secret: c3ByaW5nYm9vdC1udXJzZWFkZGEtand0LXNlY3JldC1rZXktZm9yLWhzbWFjLXNoYTUxMi1hbGdvcml0aG0tbWluaW11bS1zZWNyZXQtbGVuZ3Ro
  validity:
    accessToken: 900000
    refreshToken: 604800000

security:
  login:
    max-attempts: 5
    lock-duration-minutes: 30

razorpay:
  key.id: ${RAZORPAY_KEY_ID:}
  key.secret: ${RAZORPAY_KEY_SECRET:}

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://user.localhost:3000,http://staff.localhost:3000,http://admin.localhost:3000

  otp:
    length: 6
    expiry-minutes: 10
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: "NurseAdda <onboarding@resend.dev>"
  upload:
    dir: uploads
